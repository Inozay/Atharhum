databases:
  - name: atharhum-db
    databaseName: atharhum
    user: atharhum
    plan: basic-256mb

services:
  - type: web
    name: atharhum-production
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ATHARHUM_SECRET
        generateValue: true
      - key: ATHARHUM_BOOTSTRAP_TOKEN
        generateValue: true
      - key: ATHARHUM_SEED_DEMO
        value: 'false'
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PUBLIC_BASE_URL
        value: https://atharhum-production.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: atharhum-db
          property: connectionString
