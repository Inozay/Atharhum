services:
  - type: web
    name: atharhum
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atharhum-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: atharhum-db
    plan: free
    databaseName: atharhum
