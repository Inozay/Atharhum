services:
  - type: web
    name: atharhum-pro
    env: python
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atharhum-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://atharhum-pro.onrender.com
  - type: pserv
    name: atharhum-db
    plan: free
    databaseName: atharhum
    user: atharhum
