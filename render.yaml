services:
  - type: web
    name: atharhum-production
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ATHARHUM_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PUBLIC_BASE_URL
        value: https://atharhum-production.onrender.com
      - key: ATHARHUM_DB_PATH
        value: /opt/render/project/src/data/atharhum.db
    disk:
      name: atharhum-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
